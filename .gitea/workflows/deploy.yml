name: Build And Deploy Frontend

on:
  workflow_dispatch:

env:
  DEPLOY_HOST: 192.168.30.10
  DEPLOY_PORT: "22"
  DEPLOY_USER: voltage
  DEPLOY_PATH: /opt/iotcloud/front/disk

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Configure SSH key
        shell: bash
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '\n' >> ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Clear remote directory
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -lc \"set -euo pipefail; mkdir -p '${DEPLOY_PATH}'; find '${DEPLOY_PATH}' -mindepth 1 -maxdepth 1 -exec rm -rf {} +\""

      - name: Upload dist to remote server
        shell: bash
        run: |
          set -euo pipefail
          tar -C dist -cf - . | \
            ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -lc \"set -euo pipefail; mkdir -p '${DEPLOY_PATH}'; tar -xf - -C '${DEPLOY_PATH}'\""
